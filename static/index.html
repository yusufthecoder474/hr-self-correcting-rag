<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HR Self-Correcting RAG
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f7f6;
            color: #1f2933;
        }

        .container {
            width: min(1050px, 94%);
            margin: 35px auto 50px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            color: #12372a;
        }

        .header p {
            margin-top: 8px;
            color: #64748b;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #287a55;
        }

        button {
            margin-top: 14px;
            padding: 12px 24px;
            border: none;
            border-radius: 9px;
            background: #0f5132;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b4329;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            color: #64748b;
            min-height: 20px;
        }

        .error {
            color: #b91c1c;
        }

        .answer {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 17px;
        }

        .source {
            margin-top: 14px;
            color: #64748b;
            font-size: 14px;
        }

        .trajectory {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .attempt {
            border: 1px solid #dbe4df;
            border-radius: 12px;
            padding: 16px;
            background: #f8fbf9;
        }

        .attempt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .attempt-title {
            font-size: 17px;
            font-weight: bold;
            color: #12372a;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-stop {
            background: #dcfce7;
            color: #166534;
        }

        .badge-continue {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-insufficient {
            background: #fee2e2;
            color: #991b1b;
        }

        .decision-box {
            margin-top: 14px;
            padding: 12px;
            border-radius: 9px;
            background: white;
            border: 1px solid #e2e8f0;
        }

        .decision-title {
            font-weight: bold;
            color: #12372a;
            margin-bottom: 8px;
        }

        .row {
            margin: 7px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .label {
            font-weight: bold;
            color: #334155;
        }

        .query {
            padding: 10px 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-top: 6px;
            word-break: break-word;
        }

        .summary {
            display: grid;
            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );
            gap: 12px;
            margin-bottom: 18px;
        }

        .summary-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
        }

        .summary-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 20px;
            font-weight: bold;
            color: #12372a;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 800px) {

            .container {
                width: 94%;
                margin-top: 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .summary {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }

        }

        @media (max-width: 500px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .attempt-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            HR Self-Correcting RAG
        </h1>

        <p>
            HR policy assistant with retrieval,
            self-correction, and learned halting.
        </p>

    </div>


    <!-- Question -->

    <div class="card">

        <h2>
            Ask a Question
        </h2>

        <textarea
            id="question"
            placeholder="Example: Can an employee on probation take leave?"
        ></textarea>

        <button
            id="askButton"
            onclick="askQuestion()"
        >
            Ask Question
        </button>

        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- Answer -->

    <div
        id="answerCard"
        class="card hidden"
    >

        <h2>
            Answer
        </h2>

        <div
            id="answer"
            class="answer"
        ></div>

        <div
            id="source"
            class="source"
        ></div>

    </div>


    <!-- Trajectory -->

    <div
        id="trajectoryCard"
        class="card hidden"
    >

        <h2>
            Learned Retrieval Trajectory
        </h2>

        <div
            id="summary"
            class="summary"
        ></div>

        <div
            id="trajectory"
            class="trajectory"
        ></div>

    </div>

</div>


<script>

async function askQuestion() {

    const questionElement =
        document.getElementById(
            "question"
        );

    const button =
        document.getElementById(
            "askButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const answerCard =
        document.getElementById(
            "answerCard"
        );

    const answer =
        document.getElementById(
            "answer"
        );

    const source =
        document.getElementById(
            "source"
        );

    const trajectoryCard =
        document.getElementById(
            "trajectoryCard"
        );

    const trajectory =
        document.getElementById(
            "trajectory"
        );

    const summary =
        document.getElementById(
            "summary"
        );


    const question =
        questionElement.value.trim();


    if (!question) {

        status.textContent =
            "Please enter a question.";

        status.classList.add(
            "error"
        );

        return;
    }


    status.classList.remove(
        "error"
    );

    status.textContent =
        "Running retrieval and learned halting...";

    button.disabled = true;


    answerCard.classList.add(
        "hidden"
    );

    trajectoryCard.classList.add(
        "hidden"
    );


    try {

        const response =
            await fetch(
                "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "The API request failed."
            );
        }


        const data =
            await response.json();


        // -----------------------------------------
        // Answer
        // -----------------------------------------

        answer.textContent =
            data.answer || "";

        source.textContent =
            "Source: " +
            (
                data.source ||
                "HR policy handbook"
            );

        answerCard.classList.remove(
            "hidden"
        );


        // -----------------------------------------
        // Trajectory
        // -----------------------------------------

        const records =
            data.trajectory || [];


        trajectory.innerHTML = "";
        summary.innerHTML = "";


        let finalScore = 0;

        let finalCriticDecision = "-";

        let finalHaltingDecision = "-";

        let totalContinues = 0;


        for (
            const record
            of records
        ) {

            const criticDecision =
                String(
                    record.decision || ""
                ).toUpperCase();


            const haltingDecision =
                String(
                    record.halting_decision || ""
                ).toUpperCase();


            const runtimeAction =
                String(
                    record.runtime_action || ""
                ).toUpperCase();


            const stopProbability =
                record.stop_probability;


            if (
                haltingDecision === "CONTINUE"
            ) {

                totalContinues++;
            }


            finalScore =
                Number(
                    record.score || 0
                );


            finalCriticDecision =
                criticDecision ||
                "-";


            finalHaltingDecision =
                haltingDecision ||
                (
                    criticDecision === "SUFFICIENT"
                    ? "STOP"
                    : "-"
                );


            // -------------------------------------
            // Badge
            // -------------------------------------

            let badgeText =
                finalHaltingDecision;

            let badgeClass =
                "badge-continue";


            if (
                haltingDecision === "STOP"
                || criticDecision === "SUFFICIENT"
            ) {

                badgeText = "STOP";

                badgeClass =
                    "badge-stop";

            } else if (
                haltingDecision === "CONTINUE"
            ) {

                badgeText = "CONTINUE";

                badgeClass =
                    "badge-continue";

            } else {

                badgeText =
                    criticDecision || "UNKNOWN";

                badgeClass =
                    "badge-insufficient";
            }


            const attempt =
                document.createElement(
                    "div"
                );

            attempt.className =
                "attempt";


            const probabilityText =
                (
                    stopProbability !== null
                    &&
                    stopProbability !== undefined
                )
                ? stopProbability
                : "-";


            attempt.innerHTML = `

                <div
                    class="attempt-header"
                >

                    <div
                        class="attempt-title"
                    >

                        Attempt
                        ${escapeHtml(
                            record.attempt
                        )}

                    </div>

                    <span
                        class="badge ${badgeClass}"
                    >

                        ${escapeHtml(
                            badgeText
                        )}

                    </span>

                </div>


                <div class="row">

                    <div class="label">
                        Query
                    </div>

                    <div class="query">

                        ${escapeHtml(
                            record.query
                        )}

                    </div>

                </div>


                <div class="row">

                    <span class="label">
                        Critic Score:
                    </span>

                    ${escapeHtml(
                        record.score
                    )}

                </div>


                <div class="row">

                    <span class="label">
                        Best Score:
                    </span>

                    ${escapeHtml(
                        record.best_score
                    )}

                </div>


                <div class="row">

                    <span class="label">
                        Score Delta:
                    </span>

                    ${escapeHtml(
                        record.score_delta
                    )}

                </div>


                <div class="row">

                    <span class="label">
                        Chunk Overlap:
                    </span>

                    ${escapeHtml(
                        record.chunk_overlap
                    )}

                </div>


                <div class="row">

                    <span class="label">
                        Critic Decision:
                    </span>

                    ${escapeHtml(
                        criticDecision
                    )}

                </div>


                <div
                    class="decision-box"
                >

                    <div
                        class="decision-title"
                    >
                        Learned Halting Policy
                    </div>


                    <div class="row">

                        <span class="label">
                            Halting Decision:
                        </span>

                        ${escapeHtml(
                            haltingDecision ||
                            (
                                criticDecision ===
                                "SUFFICIENT"
                                ? "STOP"
                                : "-"
                            )
                        )}

                    </div>


                    <div class="row">

                        <span class="label">
                            STOP Probability:
                        </span>

                        ${escapeHtml(
                            probabilityText
                        )}

                    </div>


                    <div class="row">

                        <span class="label">
                            Runtime Action:
                        </span>

                        ${escapeHtml(
                            runtimeAction ||
                            (
                                criticDecision ===
                                "SUFFICIENT"
                                ? "STOP"
                                : "-"
                            )
                        )}

                    </div>


                    ${
                        record.rewritten_query
                        ? `
                        <div class="row">

                            <span class="label">
                                Rewritten Query:
                            </span>

                            <div class="query">
                                ${escapeHtml(
                                    record.rewritten_query
                                )}
                            </div>

                        </div>
                        `
                        : ""
                    }

                </div>

            `;


            trajectory.appendChild(
                attempt
            );

        }


        // -----------------------------------------
        // Summary
        // -----------------------------------------

        summary.innerHTML = `

            <div class="summary-box">

                <div
                    class="summary-label"
                >
                    Attempts
                </div>

                <div
                    class="summary-value"
                >
                    ${records.length}
                </div>

            </div>


            <div class="summary-box">

                <div
                    class="summary-label"
                >
                    Final Critic Score
                </div>

                <div
                    class="summary-value"
                >
                    ${finalScore.toFixed(2)}
                </div>

            </div>


            <div class="summary-box">

                <div
                    class="summary-label"
                >
                    Final Critic Decision
                </div>

                <div
                    class="summary-value"
                >
                    ${escapeHtml(
                        finalCriticDecision
                    )}
                </div>

            </div>


            <div class="summary-box">

                <div
                    class="summary-label"
                >
                    Final Halting Decision
                </div>

                <div
                    class="summary-value"
                >
                    ${escapeHtml(
                        finalHaltingDecision
                    )}
                </div>

            </div>

        `;


        trajectoryCard.classList.remove(
            "hidden"
        );


        status.textContent =
            "Completed.";

    } catch (error) {

        status.textContent =
            error.message;

        status.classList.add(
            "error"
        );

    } finally {

        button.disabled = false;
    }

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}

</script>

</body>

</html>
